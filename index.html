<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKKAM — рабочая панель</title>
<meta name="theme-color" content="#FF6F32">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="assets/vendor/inter/inter.css">
<link rel="stylesheet" href="assets/css/app.css">
<script>
  // Тема применяется до отрисовки, чтобы не было «вспышки»
  try {
    var t = localStorage.getItem('okkam-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
  if (window.okkamDesktop) document.documentElement.classList.add('is-desktop');
</script>
<script src="assets/js/config.js"></script>
</head>
<body>
  <div class="boot" id="boot"><img src="assets/img/logo.svg" alt="OKKAM"></div>
  <div id="app"></div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
